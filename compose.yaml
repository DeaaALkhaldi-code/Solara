services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: solara
      POSTGRES_USER: solara
      POSTGRES_PASSWORD: solara_dev_only
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - solara_postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U solara -d solara"]
      interval: 5s
      timeout: 5s
      retries: 12
volumes:
  solara_postgres:
